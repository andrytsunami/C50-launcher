name: Update ProjectorHome Release Notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH format, for example 1.0.1"
            exit 1
          fi

      - name: Update release description
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cat > release-notes.md <<'EOF'
          ProjectorHome — лёгкий Android-лаунчер, изначально разработанный для проектора SHAKACHU C50 под Android 9 (API 28).

          Совместимость с другими проекторами, Android TV и ТВ-приставками не гарантируется и требует отдельной проверки.

          APK: ProjectorHome.apk
          EOF
          gh release edit "v$RELEASE_VERSION" --notes-file release-notes.md
